<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Bike Author Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
        border-color: rgba(6, 182, 212, 0.8);
      }
      50% {
        box-shadow: 0 0 50px rgba(6, 182, 212, 0.8), inset 0 0 25px rgba(6, 182, 212, 0.4);
        border-color: rgba(34, 211, 238, 1);
      }
    }
    @keyframes neonShine {
      0% { filter: drop-shadow(0 0 4px #06b6d4) drop-shadow(0 0 12px #06b6d4); }
      50% { filter: drop-shadow(0 0 10px #22d3ee) drop-shadow(0 0 24px #06b6d4); }
      100% { filter: drop-shadow(0 0 4px #06b6d4) drop-shadow(0 0 12px #06b6d4); }
    }
    .thelagunna-card {
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .bike-glow {
      animation: neonShine 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">

  <!-- Square Glowing Author Card -->
  <div class="thelagunna-card relative aspect-square w-full max-w-sm rounded-3xl border-2 border-cyan-500/60 bg-gradient-to-b from-slate-900 via-slate-900/95 to-slate-950 p-6 flex flex-col justify-between overflow-hidden shadow-2xl backdrop-blur-xl">
    
    <!-- Ambient Light Blob -->
    <div class="absolute -top-16 -right-16 size-40 rounded-full bg-cyan-500/20 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-16 size-40 rounded-full bg-cyan-500/15 blur-3xl pointer-events-none"></div>

    <!-- Header / Author Info -->
    <div class="relative z-10 flex items-center justify-between border-b border-cyan-500/20 pb-3">
      <div class="flex items-center gap-3">
        <div class="relative size-11 rounded-full border border-cyan-400 p-0.5 shadow-[0_0_12px_rgba(6,182,212,0.6)]">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Lead Technician" class="size-full rounded-full object-cover" />
          <span class="absolute bottom-0 right-0 size-3 rounded-full bg-emerald-500 border-2 border-slate-900"></span>
        </div>
        <div>
          <h3 class="text-sm font-bold tracking-wide text-white flex items-center gap-1.5">
            Shreyas R.
            <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-semibold">VERIFIED</span>
          </h3>
          <p class="text-[11px] text-cyan-400 font-mono">Lead Recon Engineer</p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-[10px] uppercase tracking-wider text-slate-400 block font-semibold">Status</span>
        <span class="text-xs font-bold text-cyan-300 font-mono">4.9 ★★★★★</span>
      </div>
    </div>

    <!-- Center Bike Neon Art -->
    <div class="relative z-10 my-auto flex flex-col items-center justify-center">
      <div class="relative w-full max-w-[260px] flex items-center justify-center">
        <!-- Glowing Motorcycle SVG Illustration -->
        <svg class="bike-glow w-full h-auto text-cyan-400" viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <!-- Rear Wheel -->
          <circle cx="45" cy="85" r="25" class="stroke-cyan-400" stroke-width="4" />
          <circle cx="45" cy="85" r="14" class="stroke-cyan-500/40" stroke-width="2" />
          <circle cx="45" cy="85" r="4" class="fill-cyan-400 stroke-none" />
          <!-- Front Wheel -->
          <circle cx="155" cy="85" r="25" class="stroke-cyan-400" stroke-width="4" />
          <circle cx="155" cy="85" r="14" class="stroke-cyan-500/40" stroke-width="2" />
          <circle cx="155" cy="85" r="4" class="fill-cyan-400 stroke-none" />
          <!-- Chassis Frame -->
          <path d="M45 85 L85 85 L115 55 L70 55 Z" class="stroke-cyan-300" stroke-width="3.5" />
          <path d="M85 85 L135 45" class="stroke-cyan-400" stroke-width="3" />
          <!-- Front Fork & Handlebar -->
          <path d="M155 85 L135 35 L125 35" class="stroke-cyan-300" stroke-width="4" />
          <path d="M135 35 L145 32" class="stroke-cyan-200" stroke-width="3" />
          <!-- Fuel Tank & Seat -->
          <path d="M70 55 Q95 40 120 48" class="stroke-cyan-300" stroke-width="4" />
          <path d="M55 58 Q70 52 85 58" class="stroke-cyan-400" stroke-width="5" />
          <!-- Headlight Beam -->
          <polygon points="145,35 190,20 190,55" fill="rgba(34, 211, 238, 0.2)" stroke="none" />
          <!-- Exhaust Pipe -->
          <path d="M85 75 L60 88 L35 88" class="stroke-cyan-400/80" stroke-width="3" />
        </svg>
      </div>
      <p class="mt-2 font-mono text-[11px] font-bold tracking-widest text-cyan-300/80 uppercase">
        TrustWheels Spec Tuned · 250cc
      </p>
    </div>

    <!-- Footer Stats / Badge -->
    <div class="relative z-10 grid grid-cols-3 gap-2 rounded-xl bg-slate-950/70 border border-cyan-500/20 p-2.5 text-center">
      <div>
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Builds</span>
        <span class="text-xs font-mono font-bold text-white">142+</span>
      </div>
      <div class="border-x border-cyan-500/20">
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Top Dyno</span>
        <span class="text-xs font-mono font-bold text-cyan-400">185 km/h</span>
      </div>
      <div>
        <span class="block text-[10px] text-slate-400 uppercase font-bold">Quality</span>
        <span class="text-xs font-mono font-bold text-emerald-400">100%</span>
      </div>
    </div>

  </div>

</body>
</html>
